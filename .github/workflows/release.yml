name: Release Artifact

env:
  NODE_VERSION: 22.14
  RUNID_VERSION_SUFFIX: ${{ github.run_id }}.${{ github.run_attempt }}

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Use Node.js v${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Checkout
        uses: actions/checkout@v3

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Yarn 3.4.1
        run: corepack prepare yarn@3.4.1 --activate

      - name: Set min-release-age
        run: echo "min-release-age=7d" >> .npmrc

      - name: Install package dependencies
        run: |
          cd package
          yarn install --frozen-lockfile

      - name: Build
        run: |
          cd package
          yarn build

      - name: Cache workspace
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-${{ env.RUNID_VERSION_SUFFIX }}

      - name: Archive failure data
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-data
          path: |
            /home/runner/.npm/_logs
  publish_github:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Use Node.js v${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://npm.pkg.github.com"

      - name: Fetch cached workspace
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-${{ env.RUNID_VERSION_SUFFIX }}

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Yarn 3.4.1
        run: corepack prepare yarn@3.4.1 --activate

      - name: Publish to GitHub packages
        run: npm publish
        working-directory: ./package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive failure data
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-data
          path: |
            /home/runner/.npm/_logs
  publish_npmjs:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Use Node.js v${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Fetch cached workspace
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-${{ env.RUNID_VERSION_SUFFIX }}

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Yarn 3.4.1
        run: corepack prepare yarn@3.4.1 --activate

      - name: Ensure npm >= 11.5.1 (Trusted Publishing requirement)
        run: |
          CURRENT_NPM=$(npm -v)
          MIN_NPM=11.5.1
          if [ "$(printf '%s\n' "$MIN_NPM" "$CURRENT_NPM" | sort -V | tail -n1)" = "$CURRENT_NPM" ]; then
            echo "npm $CURRENT_NPM already satisfies >= $MIN_NPM"
          else
            npm install -g npm@$MIN_NPM
          fi

      - name: Publish to npmjs
        run: npm publish --access=public
        working-directory: ./package

      - name: Archive failure data
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-data
          path: |
            /home/runner/.npm/_logs
